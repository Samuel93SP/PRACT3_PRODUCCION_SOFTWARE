name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            # 1️ Checkout del código
            - uses: actions/checkout@v4

            # 2️ Configurar Python
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11" # Ajusta si usas otra versión

            # 3️ Instalar dependencias
            - name: Install dependencies
              run: |
                  pip install --upgrade pip
                  pip install uv
                  uv sync
                  uv pip install ruff mypy pytest pytest-bdd

            # 4️ Formatear código automáticamente
            - name: Format code with Ruff
              run: uv run ruff format .

            # 5️ Comprobar errores en el código
            - name: Lint with Ruff
              run: uv run ruff check .

            - name: Type check with Mypy
              run: uv run mypy .

            # 6️ Ejecutar tests unitarios
            - name: Run unit tests
              run: uv run pytest core/tests/unit

            # 7️ Ejecutar tests de integración
            - name: Run integration tests
              run: uv run pytest core/tests/integration

            # 8️ Ejecutar tests BDD
            - name: Run BDD tests
              run: uv run pytest core/tests/behaviour
